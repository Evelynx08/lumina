<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="barra.css">
<script src="bookos-palette.js"></script>
<title>Lumina</title>
</head>
<body>
<header class="barra" data-tauri-drag-region>
  <span class="titulo" data-tauri-drag-region>Lumina</span>
  <div class="botones">
    <button id="mas" title="Más opciones" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM18.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>
    </button>
    <button id="minimizar" title="Minimizar">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
    </button>
    <button id="maximizar" title="Maximizar">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.25 7.5A2.25 2.25 0 0 1 7.5 5.25h9a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-9a2.25 2.25 0 0 1-2.25-2.25v-9Z"/></svg>
    </button>
    <button id="cerrar" title="Cerrar (sigue recibiendo mensajes)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6l12 12"/></svg>
    </button>
  </div>
</header>

<div id="velo" hidden></div>
<div id="menu" class="popover" role="menu" hidden>
  <button class="opcion" id="recargar" role="menuitem">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
    <span>Recargar WhatsApp</span>
  </button>
  <label class="opcion" role="menuitemcheckbox">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.098 19.902a3.75 3.75 0 0 0 5.304 0l6.401-6.402M6.75 21A3.75 3.75 0 0 1 3 17.25V4.125C3 3.504 3.504 3 4.125 3h5.25c.621 0 1.125.504 1.125 1.125v4.072M6.75 21a3.75 3.75 0 0 0 3.75-3.75V8.197M6.75 21h13.125c.621 0 1.125-.504 1.125-1.125v-5.25c0-.621-.504-1.125-1.125-1.125h-4.072M10.5 8.197l2.88-2.88c.438-.439 1.15-.439 1.59 0l3.712 3.713c.44.44.44 1.152 0 1.59l-2.879 2.88M6.75 17.25h.008v.008H6.75v-.008Z"/></svg>
    <span>Color dinámico</span>
    <input type="checkbox" id="paleta" class="toggle">
  </label>
  <div class="divisor"></div>
  <p class="cabecera">Fondo de los chats</p>
  <div role="radiogroup" aria-label="Fondo de los chats">
    <button class="opcion radio" role="radio" data-fondo="escritorio"><span class="circulo"></span><span>Fondo del escritorio</span></button>
    <button class="opcion radio" role="radio" data-fondo="imagen"><span class="circulo"></span><span id="nombre-imagen">Imagen propia…</span></button>
    <button class="opcion radio" role="radio" data-fondo="ninguno"><span class="circulo"></span><span>Ninguno</span></button>
  </div>
  <div class="divisor"></div>
  <button class="opcion" id="salir" role="menuitem">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>
    <span>Salir de Lumina</span>
  </button>
</div>

<script src="barra.js"></script>
</body>
</html>
